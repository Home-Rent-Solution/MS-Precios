spring:
  application:
    name: MS-Precios

  datasource:
    url: jdbc:mysql://localhost:3306/precios_db
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8088