spring:
  application:
    name: ms-precios
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

eureka:
  client:
    enabled: false

ms:
  propiedades:
    url: ${MS_PROPIEDADES_URL:http://localhost:8081}
  reservas:
    url: ${MS_RESERVAS_URL:http://localhost:8084}
  pagos:
    url: ${MS_PAGOS_URL:http://localhost:8085}

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update