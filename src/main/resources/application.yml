spring:
  application:
    name: ms-precios
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/db_precios?createDatabaseIfNotExist=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: ${PORT:8088}
  forward-headers-strategy: framework

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

ms:
  propiedades:
    url: ${MS_PROPIEDADES_URL:http://localhost:8081}
  reservas:
    url: ${MS_RESERVAS_URL:http://localhost:8084}
  pagos:
    url: ${MS_PAGOS_URL:http://localhost:8085}

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update